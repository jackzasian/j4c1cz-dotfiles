# Avahi: only advertise on real LAN (not Clash Meta 198.18.x)
# Install: sudo cp this file to /etc/avahi/avahi-daemon.conf.d/10-lan-only.conf
#          sudo systemctl restart avahi-daemon
# Or run: sudo ~/.config/omarchy/fix-lan-discovery.sh

[server]
allow-interfaces=wlan0,lo
deny-interfaces=Meta,docker0,br-+,veth+,virbr+,tun+,tap+
allow-point-to-point=no
