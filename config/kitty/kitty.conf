include ~/.local/state/omarchy/current/theme/kitty.conf

# Font
font_family JetBrainsMono Nerd Font
bold_italic_font auto
font_size        9.0

# Window
window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0

# Keybindings
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter send_text all \e[13;2u
# Kitty legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send CSI-u so tmux can match M-S-Enter.
map alt+shift+enter send_text all \e[13;4u

# Allow remote access
allow_remote_control yes

# REMOVED 2026-08-15: this made EVERY kitty window launch into Zellij
# regardless of invocation, which is not what any actual caller wants — both
# real Zellij launch paths (~/.local/bin/kitty-agents, SUPER+ALT+RETURN in
# bindings.lua) already invoke `kitty ... -e zellij ...` explicitly and never
# relied on this default. It was also the root cause of "SUPER+RETURN opens
# the wrong terminal" bugs today: a bare `kitty` (Quattro's own default
# terminal binding uses xdg-terminal-exec -> kitty.desktop with no -e) always
# hit Zellij too, no matter what SUPER+RETURN's own command was.
# shell zellij --layout agents attach --create agents

# Aesthetics
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor
enable_audio_bell no

# Minimal Tab bar styling
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# Allow cwd lookup from global keybindings
listen_on unix:${XDG_RUNTIME_DIR}/omarchy-kitty-{kitty_pid}
