# Hyprspace — compact overview strip (0xl30 / Hyprland 0.55 fork)
# Reload: hyprctl reload

plugin {
    hyprspace {
        panel_height = 140
        workspace_margin = 6
        workspace_border_size = 1
        panel_border_width = 1
        reserved_area = 32

        on_bottom = false
        center_aligned = true
        exit_on_click = true
        exit_on_switch = true
        switch_on_drop = true
        auto_drag = true
        show_new_workspace = true
        show_empty_workspace = false

        disable_gestures = true
        reverse_swipe = true
        exit_key = Escape
    }
}
