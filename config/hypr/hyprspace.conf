# Hyprspace — plugin reads plugin:overview:* (camelCase), NOT plugin:hyprspace
# Pin: 0xl30/Hyprspace 8b4284e for Hyprland 0.56
# overrideGaps MUST stay 0 — Legacy::mgr().lock() aborts on 0.56 (Error Overlay)

plugin {
    overview {
        panelHeight = 140
        workspaceMargin = 6
        workspaceBorderSize = 1
        panelBorderWidth = 1
        reservedArea = 32

        onBottom = false
        centerAligned = true
        exitOnClick = true
        exitOnSwitch = true
        switchOnDrop = true
        autoDrag = true
        showNewWorkspace = true
        showEmptyWorkspace = false

        disableGestures = true
        reverseSwipe = true
        exitKey = Escape

        # Skip Config::Legacy::mgr().lock() path that crashes Hyprland 0.56
        overrideGaps = 0
    }
}
