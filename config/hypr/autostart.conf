# Extra autostart processes
# fcitx5: started by Omarchy default autostart (uwsm-app -- fcitx5 --disable notificationitem)

# Flux-style night light: regenerate schedule at login; hyprsunset itself is
# systemd user unit only (duplicate exec-once caused "CTM manager already running").
exec-once = uwsm-app -- hyprsunset-flux-schedule
# Do NOT exec-once hyprsunset — use: systemctl --user enable --now hyprsunset.service

# Omarchy default autostart also exec-once's hypridle, but hypridle.service is already
# WantedBy=graphical-session.target. Two hypridles double-inhibit suspend/sleep.
# Keep the systemd unit; stop the Hyprland-spawned duplicate shortly after login.
exec-once = sleep 2 && systemctl --user stop -- $(systemctl --user --no-legend --plain list-units 'app-Hyprland-hypridle-*.scope' 2>/dev/null | awk '{print $1}')

# XREAL cinema: start manually (xreal-cinema). auto_connect=0 in ~/.config/xreal/config

# Login app layout (workspace-scoped launch; does not pin later windows)
# Staggered so GPU-heavy apps (Electron/Chromium) init the GPU serially, not all
# at once: concurrent GPU-process init on Intel xe fails intermittently
# ("GPU process isn't usable" / silent no-window). Light apps go first.
# Delay also lets hyprpm reload + Clash settle before proxy-dependent apps.
exec-once = sleep 4 && hyprctl dispatch exec "[workspace 1 silent] wechat-launch"
exec-once = sleep 6 && hyprctl dispatch exec "[workspace 1 silent] discord-launch"
exec-once = sleep 9 && hyprctl dispatch exec "[workspace 2 silent] uwsm-app -- zen-browser"
# Kitty + Zellij "agents" layout (cursor/claude/opencode + ssh×2 + nvim)
exec-once = sleep 12 && hyprctl dispatch exec "[workspace 3 silent] uwsm-app -- kitty-agents"
exec-once = sleep 13 && hyprctl dispatch exec "[workspace 3 silent] uwsm-app -- nautilus --new-window"
exec-once = sleep 15 && hyprctl dispatch exec "[workspace 4 silent] uwsm-app -- cursor"
exec-once = sleep 18 && hyprctl dispatch exec "[workspace 4 silent] uwsm-app -- obsidian"
exec-once = sleep 21 && hyprctl dispatch exec "[workspace 5 silent] uwsm-app -- spotify"
# Studio Display: zero laptop panel + keyboard backlight (watcher via systemd)
exec-once = uwsm-app -- studio-dock-lights auto
# Waybar profile (docked vs laptop): initial apply, then re-apply on hotplug
exec-once = ~/.config/waybar/scripts/waybar-apply-profile.sh
exec-once = ~/.config/waybar/scripts/waybar-monitor-watch.sh
# Waybar AC/battery poll intervals
exec-once = ~/.config/waybar/scripts/waybar-power-watch.sh
# Steam: disabled via Hidden=true in ~/.config/autostart/steam.desktop
