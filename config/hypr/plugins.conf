# Hyprland plugins (hyprpm) — installed 2026-05-27
# Docs: ~/Obsidian/J4c1c/04 Tech/Hermes/hypr-plugins-stack.md

# Rebuild+reload plugins on startup so ABI matches after Hyprland updates
# (hyprpm reload alone silently fails to load stale plugin binaries; no -f,
#  so it only rebuilds when headers/commits actually changed)
exec-once = sleep 5 && hyprpm update -n > /tmp/hyprpm-startup.log 2>&1

# --- hypr-dynamic-cursors (VirtCode) ---
# Anya-cursors theme is sourced from hyprland.conf; use mode=none so only shake-to-find runs.
# Docs: https://github.com/VirtCode/hypr-dynamic-cursors
plugin {
    dynamic-cursors {
        enabled = true
        mode = none

        # Shake-to-find (macOS "mouse shake enlarge" behaviour)
        shake {
            enabled = true
            # lower = triggers sooner (default 6.0; trackpads need lower)
            threshold = 3.0
            # magnification at shake start
            base = 4.0
            # magnification increase per second of continued shaking
            speed = 4.0
            influence = 0.0
            # 0 = no upper limit
            limit = 0.0
            # ms the cursor stays magnified after shaking ends
            timeout = 2000
            # don't run tilt/rotate effects while shaking (mode is none anyway)
            effects = false
            ipc = false
        }

        # High-res hyprcursor textures when magnified
        hyprcursor {
            enabled = true
            nearest = 1
            resolution = -1
            fallback = clientside
        }
    }
}

