# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" bash -c "tmux attach || tmux new -s Work"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
# bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify  # needs: flatpak install flathub com.spotify.Client
bindd = SUPER SHIFT ALT, M, Music TUI, exec, omarchy-launch-or-focus-tui cliamp
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT ALT, D, Discord, exec, uwsm-app -- discord-launch
bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus ^signal$ "uwsm-app -- signal-desktop"
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian"
bindd = SUPER SHIFT, W, Wechat, exec, omarchy-launch-or-focus wechat "uwsm-app -- wechat"
bindd = SUPER SHIFT, SLASH, Passwords, exec, omarchy-launch-or-focus Bitwarden "uwsm-app -- bitwarden-desktop"

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT ALT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER SHIFT CTRL, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
bindd = SUPER SHIFT, P, Google Photos, exec, omarchy-launch-or-focus-webapp "Google Photos" "https://photos.google.com/"
bindd = SUPER SHIFT, X, X, exec, omarchy-launch-webapp "https://x.com/"
bindd = SUPER SHIFT ALT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"

# Add extra bindings
# bind = SUPER SHIFT, R, exec, alacritty -e ssh your-server

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

# CleanShot-style captures: Super+Ctrl+1/2/3/4 (physical Caps = Ctrl after swapcaps)
bindd = SUPER CTRL, 1, Capture area, exec, omarchy-capture-screenshot region
bindd = SUPER CTRL, 2, Capture OCR, exec, omarchy-capture-text-extraction
bindd = SUPER CTRL, 3, Capture fullscreen, exec, omarchy-capture-screenshot fullscreen
bindd = SUPER CTRL, 4, Capture window, exec, omarchy-capture-screenshot windows

# Phone + personal agent
bindd = SUPER SHIFT, K, Phone KDE Connect, exec, uwsm-app -- sh -c 'kdeconnect-pair-help; uwsm-app -- kdeconnect-app'
bindd = SUPER SHIFT, T, TickTick, exec, uwsm-app -- ticktick-launch
bindd = SUPER SHIFT, J, Hermes agent, exec, uwsm-app -- xdg-terminal-exec --dir="$HOME/Obsidian/J4c1c" -- hermes --tui

# Raycast-style audio output switch (Mac: Cmd+Alt+O) — also on Super+Mute by default
bindd = SUPER ALT, O, Switch audio output, exec, omarchy-audio-output-switch

# Hyprspace workspace overview (requires plugin — hyprctl dispatch overview:toggle)
bindd = SUPER, GRAVE, Workspace overview, overview:toggle
bindd = SUPER, code:41, Workspace overview, overview:toggle
bindd = SUPER SHIFT, GRAVE, Workspace overview (all monitors), overview:toggle, all
bindd = SUPER SHIFT, V, Workspace overview, overview:toggle

# Logitech MX Keys
# bind = SUPER SHIFT, S, exec, omarchy-capture-screenshot      # Print Screen Button
# bind = SUPER, H, exec, voxtype record toggle                 # Dictation Button
# bind = SUPER, PERIOD, exec, omarchy-launch-walker -m symbols # Emoji Button

# LID_SWITCH: screen off on close, on when open (server mode)
bindl = , switch:on:Lid Switch, exec, hyprctl dispatch dpms off
bindl = , switch:off:Lid Switch, exec, hyprctl dispatch dpms on

# monitorv2 in monitors.conf breaks stock internal-monitor toggle (legacy monitor=,disable)
unbind = SUPER CTRL, Delete
bindd = SUPER CTRL, Delete, Toggle laptop display, exec, /home/jackz/.local/bin/omarchy-hyprland-monitor-internal toggle
