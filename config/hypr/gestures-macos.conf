# macOS-like ThinkPad touchpad gestures (Hyprland 0.55+ native gestures)
# hyprgrass is for touchscreens only — see plugins.conf
# Docs: ~/Obsidian/J4c1c/04 Tech/Hermes/hypr-plugins-stack.md
#
# Overview gestures use dispatcher+exec (same parse-safe pattern as bindings.conf).
# Never bind raw overview:toggle here — plugin loads after config parse via hyprpm.

gestures {
    # --- Spaces: 3-finger horizontal swipe between workspaces ---
    gesture = 3, horizontal, workspace

    # --- Hyprspace overview (ThinkPad often has no 4-finger; use 3-finger up too) ---
    gesture = 4, up, dispatcher, exec, hyprctl dispatch overview:toggle
    gesture = 4, down, dispatcher, exec, hyprctl dispatch overview:close
    gesture = 3, up, dispatcher, exec, hyprctl dispatch overview:toggle

  workspace_swipe_distance = 350
  workspace_swipe_cancel_ratio = 0.2
  workspace_swipe_min_speed_to_force = 25
  workspace_swipe_direction_lock = true
  workspace_swipe_direction_lock_threshold = 8
  workspace_swipe_create_new = true
  workspace_swipe_forever = false
  # false ≈ macOS direction (swipe left → space on the right). Flip if backwards.
  workspace_swipe_invert = false
}

# Smooth workspace slide while swiping (Omarchy default disables this)
animations {
    animation = workspaces, 1, 4, easeOutQuint, slide
}
