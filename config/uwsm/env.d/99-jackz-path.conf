# Quattro's /usr/share/omarchy/default/bash/env-bootstrap APPENDS ~/.local/bin
# to PATH, so /usr/bin/<x> shadows every shim in ~/.local/bin. Pre-Quattro it
# was ahead of /usr/bin, which is what made the yay + cursor wrappers work.
# Put it back in front. 99- sorts after Omarchy's own env.d entries.
#
# Depends on this ordering: ~/.local/bin/yay (Clash HTTP proxy, no SOCKS) and
# ~/.local/bin/omarchy-pkg-aur-accessible (proxied AUR reachability check).
export PATH="$HOME/bin:$HOME/.local/bin:$PATH"
